name: iLemmings
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iLemmings-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iLemmings
      - path: Resources
    info:
      path: Sources/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        # All four, otherwise the build warns that an app which doesn't
        # require full screen must support every orientation. iPhone ignores
        # upside-down anyway; on iPad it just means the level doesn't flip
        # away when someone rotates the device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: iLemmings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ilemmings
        PRODUCT_NAME: iLemmings
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iLemmings-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/iLemmings
      - path: Resources
    info:
      path: Sources/Info-macOS.plist
      properties:
        CFBundleDisplayName: iLemmings
        LSApplicationCategoryType: public.app-category.games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ilemmings
        PRODUCT_NAME: iLemmings
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true

  iLemmingsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: iLemmings-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ilemmings.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iLemmings.app/Contents/MacOS/iLemmings
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iLemmings-iOS:
    build:
      targets:
        iLemmings-iOS: all
    run:
      config: Debug
  iLemmings-macOS:
    build:
      targets:
        iLemmings-macOS: all
        iLemmingsTests: all
    run:
      config: Debug
    test:
      targets:
        - iLemmingsTests
