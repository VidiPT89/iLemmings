name: iLemmings
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  iLemmings-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iLemmings
      - path: Resources
    info:
      path: Sources/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: iLemmings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ilemmings
        PRODUCT_NAME: iLemmings
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

  iLemmings-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/iLemmings
      - path: Resources
    info:
      path: Sources/Info-macOS.plist
      properties:
        CFBundleDisplayName: iLemmings
        LSApplicationCategoryType: public.app-category.games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ilemmings
        PRODUCT_NAME: iLemmings
        COMBINE_HIDPI_IMAGES: true
        ENABLE_HARDENED_RUNTIME: true

schemes:
  iLemmings-iOS:
    build:
      targets:
        iLemmings-iOS: all
    run:
      config: Debug
  iLemmings-macOS:
    build:
      targets:
        iLemmings-macOS: all
    run:
      config: Debug
